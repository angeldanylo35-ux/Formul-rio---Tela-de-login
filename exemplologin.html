<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>


    <div class="tela-login">



        <div class="title">
        
            <h1>Login</h1>

            <div>
                <img class="img" src="./img/download.jpg" alt="">
            </div>
        
        </div>



        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">endereço de email:</label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
        </div>

        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Nome de usuário:</label>
            <input type="text" class="form-control" id="exampleFormControlTextarea1" placeholder="nome de usuário">
        </div>

        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Senha:</label>
            <input type="password" class="form-control" id="exampleFormControlTextarea1" placeholder="senha">
            <div class="btn">
                <button class="btn btn-primary" type="submit" onclick="login()">Entrar</button>
            </div>

        </div>

    </div>



    <script src="./js/javascript.js"></script>






</body>

</html>
